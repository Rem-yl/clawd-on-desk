<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="pet-chat.css">
<title>Pet Chat</title>
</head>
<body>
<div class="chat" id="chat">
  <header class="chat-head" id="chatHead">
    <div class="chat-identity">
      <span class="chat-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/>
        </svg>
      </span>
      <span class="chat-meta">
        <span class="chat-title" id="chatTitle">Chat</span>
        <span class="chat-sub" id="chatSub" data-tone="pending">…</span>
      </span>
    </div>
    <div class="chat-head-actions">
      <button class="icon-btn" id="btnClear" type="button" title="Clear" aria-label="Clear conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
        </svg>
      </button>
      <button class="icon-btn" id="btnClose" type="button" title="Close" aria-label="Close chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="chat-log" id="chatLog" role="log" aria-live="polite"></div>

  <div class="chat-error" id="chatError" hidden></div>

  <form class="chat-compose" id="chatCompose">
    <div class="compose-shell">
      <textarea
        id="chatInput"
        class="chat-input"
        rows="1"
        maxlength="4000"
        spellcheck="false"
        placeholder="Say something…"
        aria-label="Message"></textarea>
      <button class="send-btn" id="btnSend" type="submit" title="Send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
      <button class="send-btn stop" id="btnStop" type="button" title="Stop" aria-label="Stop" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="6" width="12" height="12" rx="2.5"/>
        </svg>
      </button>
    </div>
  </form>
</div>
<script src="pet-chat-renderer.js"></script>
</body>
</html>
